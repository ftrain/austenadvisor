# Reviser (the Advisor writing tutor) at https://unscroll.com/reviser/, on unscroll.exe.xyz. Included by the
# unscroll.com server block, which gates the whole site with its password first; this file holds locations only.
# Installed to /etc/nginx/unscroll.d/reviser.conf from this repository; edit it here, not on the box.
#
# nginx takes /reviser/ off before the request reaches the app (proxy_pass ends in /), so the server answers at its
# root; the page is built with ADVISOR_BASE=/reviser/ so its assets and API calls come back under /reviser/.

location = /reviser { return 301 /reviser/; }

location /reviser/ {
    proxy_pass http://127.0.0.1:8010/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection '';
    proxy_set_header X-Forwarded-Proto https;
    # The daily per-address budget counts the LAST X-Forwarded-For entry. exe.dev's proxy puts the visitor's
    # address there; $proxy_add_x_forwarded_for would put exe.dev's own after it and pool every visitor under one
    # address. So pass the header on as it came, and send nginx's peer only when there is none (never an empty
    # header: a request with none from loopback counts as local and skips the budget).
    set $reviser_xff $http_x_forwarded_for;
    if ($reviser_xff = '') { set $reviser_xff $remote_addr; }
    proxy_set_header X-Forwarded-For $reviser_xff;
    proxy_set_header X-Real-IP $remote_addr;
    # A rewrite is a job the page polls in short answers, but POST /api/rewrite without job:true streams NDJSON for
    # as long as the writer runs, so nothing is held back, and a slow writer has minutes.
    proxy_buffering off;
    proxy_cache off;
    proxy_connect_timeout 10s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
    client_max_body_size 2m;
}
